plugins {
    id 'java'
}

group = 'com.mobile'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.appium:java-client:10.1.1'

    testImplementation 'io.cucumber:cucumber-java:8.0.4'
    testImplementation 'io.cucumber:cucumber-picocontainer:8.0.4'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Jackson backs the JSON that the Cucumber HTML report plugin writes
    testRuntimeOnly 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    testRuntimeOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.19.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('installApp', Exec) {
    group = 'verification'
    description = 'Installs the configured APKM splits when the app is not installed'

    def script = file('scripts/install-app.ps1').absolutePath
    def shell = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'powershell.exe' : 'pwsh'
    commandLine shell, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', script
}

tasks.register('cucumberCli', JavaExec) {
    group = 'verification'
    description = 'Runs the Cucumber alarm scenario'

    dependsOn tasks.named('testClasses'), tasks.named('installApp')

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.cucumber.core.cli.Main'

    doFirst {
        if (fileTree('src/test/resources/features').matching { include '**/*.feature' }.isEmpty()) {
            throw new GradleException('No Cucumber feature files were found.')
        }
    }

    args '--glue', 'com.mobile',
            '--plugin', 'pretty',
            '--plugin', 'html:build/reports/cucumber/report.html',
            'src/test/resources/features'
}

check.dependsOn cucumberCli
